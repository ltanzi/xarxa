services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xarxa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xarxa
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        # NEXT_PUBLIC_* must be set at BUILD time so it gets baked into
        # the client bundle. Server-side SENTRY_DSN below is runtime.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
    environment:
      DATABASE_URL: "postgresql://xarxa:${POSTGRES_PASSWORD}@postgres:5432/xarxa?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: "https://xarxa.help"
      AUTH_TRUST_HOST: "true"
      RESEND_API_KEY: ${RESEND_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      EMAIL_FROM: "noreply@xarxa.help"
      NODE_ENV: production
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - postgres
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
